# Default configuration for runexperiment
# Values here are merged into CLI args if not provided explicitly.
sbatch:
  time: "01:00:00" # Add more SLURM options here
expdir: "./output"
targetdir: "./results"
sbatch_commands_per_task: 1 #Allows to merge multiple tasks into a single slurm task run
# Command that runs the experiment script in generated run commands, e.g.
# inside a container (default: the current interpreter and script):
# invocation: "apptainer exec image.sif python /abs/path/experiment.py"
# Write SLURM launch scripts without submitting them (default: true):
# submit: false
